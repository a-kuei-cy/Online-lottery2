<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線上抽籤｜興嘉國小</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#111827;--mut:#6b7280;--fill:#f3f4f6;--bd:#d1d5db;--navy:#0b1f3a;--navy2:#143060;--btn:#0b1f3a;--btnx:#fff;--tabon:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d14;--card:#171923;--tx:#eceef5;--mut:#9aa1b2;--fill:#222532;--bd:#343849;--btn:#3b5bdb;--tabon:#2f3446}}
:root[data-theme="dark"]{--bg:#0d0d14;--card:#171923;--tx:#eceef5;--mut:#9aa1b2;--fill:#222532;--bd:#343849;--btn:#3b5bdb;--tabon:#2f3446}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:600}
.wrap{max-width:660px;margin:0 auto;padding:28px 16px 48px}
.tabs{display:flex;background:var(--fill);border-radius:18px;padding:5px;margin-bottom:20px}
.tab{flex:1;padding:14px 0;border:0;background:transparent;color:var(--mut);border-radius:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tab.on{background:var(--tabon);color:var(--tx);box-shadow:0 2px 8px rgba(40,30,90,.18)}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.fl{font-size:14px;font-weight:800;margin:0 0 10px;display:block}
textarea,input[type=number]{width:100%;border:1px solid var(--bd);border-radius:16px;background:var(--fill);color:var(--tx);font:inherit;font-size:16px;padding:14px;outline:none}
textarea{height:250px;resize:vertical;margin-bottom:22px}
textarea::placeholder{color:var(--mut);opacity:.8}
input[type=number]{height:50px;margin-bottom:16px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:18px;cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--btn)}
.go{width:100%;height:52px;border:0;border-radius:16px;background:var(--btn);color:var(--btnx);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.go:disabled{opacity:.6}
.res{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:26px;padding:18px 20px;min-height:80px;margin-bottom:20px}
.rh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;min-height:44px}
.rh span.t{color:#a9bde3;font-size:13px;font-weight:800;padding-top:30px}
.rh b{font-size:26px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-end}
.chip{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 14px;font-size:18px}
.rh b.one{font-size:clamp(30px,7vw,46px)}
.cnt{background:var(--fill);border-radius:22px;padding:22px 20px;display:flex;justify-content:space-between;align-items:center}
.cnt span{color:var(--mut);font-size:13px;font-weight:800}
.cnt b{font-size:24px}
.acts{display:flex;gap:10px;margin-top:14px}
.g{flex:1;height:42px;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
ol{margin:0;padding-left:26px;line-height:2;font-size:17px;max-height:340px;overflow:auto}
.hide{display:none}
.hist{margin-top:26px;font-size:13px;color:var(--mut)}
.hist div{padding:6px 0;border-bottom:1px solid var(--bd)}
.top{text-align:right;margin-bottom:6px}
.top button{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><button id="theme">☀︎ / ☾ 切換</button></div>
 <div class="tabs"><button class="tab on" data-t="pick">隨機抽籤</button><button class="tab" data-t="shuf">名單洗牌</button></div>

 <div id="pick" class="cols">
  <div class="card">
   <label class="fl">名單（一行一個名字）</label>
   <textarea id="list" placeholder="小明&#10;小華&#10;小美"></textarea>
   <label class="fl">抽出人數</label>
   <input type="number" id="n" min="1" value="1">
   <label class="ck"><input type="checkbox" id="uniq"> 同一名字只能中一次</label>
   <button class="go" id="go">開始抽籤</button>
  </div>
  <div>
   <div class="res"><div class="rh"><span class="t">抽籤結果</span><b id="out">—</b></div><div class="chips" id="chips"></div></div>
   <div class="cnt"><span>名單人數</span><b id="cnt">0</b></div>
   <div class="acts"><button class="g" id="save">儲存目前結果</button><button class="g" id="copy">複製結果</button></div>
  </div>
 </div>

 <div id="shuf" class="cols hide">
  <div class="card">
   <label class="fl">名單（一行一個名字）</label>
   <textarea id="list2" placeholder="小明&#10;小華&#10;小美"></textarea>
   <button class="go" id="go2">洗牌排序</button>
  </div>
  <div>
   <div class="card"><label class="fl">洗牌結果</label><ol id="out2"></ol></div>
   <div class="acts"><button class="g" id="copy2">複製結果</button></div>
  </div>
 </div>

 <div class="hist" id="hist"></div>
</div>
<script>
const $=s=>document.querySelector(s),K='xj-picker';
let last=[],last2=[];
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function names(id){return $(id).value.split('\n').map(s=>s.trim()).filter(Boolean)}
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function upd(){$('#cnt').textContent=names('#list').length;sv(K+'-l',$('#list').value)}
$('#list').value=ld(K+'-l','');$('#list2').value=ld(K+'-l2','');upd();
$('#list').oninput=upd;$('#list2').oninput=()=>sv(K+'-l2',$('#list2').value);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
 $('#pick').classList.toggle('hide',t.dataset.t!=='pick');$('#shuf').classList.toggle('hide',t.dataset.t!=='shuf')});
$('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0d0d14'?'light':'dark'};
function draw(){
 let pool=names('#list');const n=Math.max(1,parseInt($('#n').value)||1),u=$('#uniq').checked,res=[];
 while(res.length<n&&pool.length){const i=rnd(pool.length),w=pool[i];res.push(w);if(u)pool=pool.filter(x=>x!==w);else pool.splice(i,1)}
 if(res.length<n)alert('名單不足，只能抽出 '+res.length+' 位');
 return res}
function show(res){last=res;const o=$('#out');
 if(res.length===1){o.className='one';o.textContent=res[0];$('#chips').innerHTML=''}
 else{o.className='';o.textContent=res.length+' 位';$('#chips').innerHTML=res.map(r=>'<span class="chip">'+esc(r)+'</span>').join('')}}
$('#go').onclick=()=>{
 const pre=names('#list');if(!pre.length){alert('請先輸入名單');return}
 const o=$('#out');o.className='one';$('#chips').innerHTML='';let k=0;$('#go').disabled=true;
 const t=setInterval(()=>{o.textContent=pre[rnd(pre.length)];
  if(++k>14){clearInterval(t);$('#go').disabled=false;show(draw())}},70)};
$('#go2').onclick=()=>{last2=shuffle(names('#list2'));$('#out2').innerHTML=last2.map(x=>'<li>'+esc(x)+'</li>').join('')};
function cp(t){try{navigator.clipboard.writeText(t)}catch(e){}}
$('#copy').onclick=()=>cp(last.join('、'));
$('#copy2').onclick=()=>cp(last2.map((x,i)=>(i+1)+'. '+x).join('\n'));
function hist(){const h=ld(K+'-h',[]);$('#hist').innerHTML=h.length?'<b>已儲存結果</b>'+h.map(x=>'<div>'+esc(x.r.join('、'))+'　<span>'+x.t+'（名單 '+x.c+' 人）</span></div>').join(''):''}
$('#save').onclick=()=>{if(!last.length)return;const h=ld(K+'-h',[]);h.unshift({r:last,c:names('#list').length,t:new Date().toLocaleString('zh-TW',{hour12:false})});sv(K+'-h',h.slice(0,30));hist()};
hist();
</script>
</body>
</html>
